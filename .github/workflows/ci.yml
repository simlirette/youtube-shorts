name: CI

# Deterministic suite: no API keys, no network providers, real FFmpeg, real PostgreSQL.
on:
  push:
    branches: [main, 'feat/**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: shorts_test
          # Throwaway CI database on the job network; no credential is needed or stored.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://postgres@localhost:5432/shorts_test
      # Guarantee that nothing in this job can reach a paid provider.
      OPENAI_API_KEY: ''
      GEMINI_API_KEY: ''
      TAVILY_API_KEY: ''
      ELEVENLABS_API_KEY: ''
      PIXABAY_API_KEY: ''
      PEXELS_API_KEY: ''
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg && ffmpeg -version | head -1
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Typecheck (packages, apps and tests)
        run: pnpm typecheck
      - name: Build
        run: pnpm build
      - name: Boot smoke test (catches empty/broken provider modules)
        run: pnpm cli --help
      - name: Tests (mock providers, real media, PostgreSQL)
        run: pnpm test
